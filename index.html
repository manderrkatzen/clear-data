<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearData | Data Quality Copilot</title>
    <link rel="preload" href="fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="spreadsheet.css" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="stylesheet" href="review.css" />
    <link rel="stylesheet" href="design-system.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#data"><svg class="brand-symbol" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 5h8v8H5zM16 5h7v8h-7zM5 16h8v7H5z" fill="currentColor"/><path d="m17 20 2 2 5-6" fill="none" stroke="#9dbfff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>ClearData</a>
        <p class="product-label">ANALYST WORKSPACE</p>
        <nav id="navigation" aria-label="Primary navigation">
          <button class="nav-link active" data-screen="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 4 14 4 14 0V5M5 12c0 4 14 4 14 0"/></svg>Dataset</button>
          <button class="nav-link" data-screen="view" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></svg>Explore</button>
          <button class="nav-link" data-screen="issues" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></svg>Review <b id="navIssueCount">0</b></button>
          <button class="nav-link" data-screen="changes" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v6h6M5 10a8 8 0 1 1-1 7M12 8v5l3 2"/></svg>Decisions <b id="navChangeCount" class="hidden">0</b></button>
          <button class="nav-link" data-screen="report" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>Report</button>
        </nav>
        <div class="sidebar-bottom"><button class="batch-card" id="batchButton" disabled><span><strong>Continue review</strong><em>Open the findings queue</em></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button></div>
      </aside>
      <main>
        <header class="topbar"><div><p class="eyebrow" id="topEyebrow">DATA SOURCE</p><strong id="datasetName">No dataset loaded</strong></div><div class="header-actions"><span class="status-badge neutral" id="versionBadge">Original</span><span class="status-badge warning hidden" id="headerIssues">0 unresolved</span><button class="ghost hidden" id="undoButton">Undo last change</button><button class="primary hidden" id="contextAction">Open in View</button></div></header>
        <div id="screen" class="screen"></div>
      </main>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv" hidden />
    <input type="file" id="projectInput" accept=".json,application/json" hidden />
    <input type="file" id="rulesInput" accept=".json,application/json" hidden />
    <dialog id="confirmDialog"><div id="dialogContent"></div></dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="cleaning-engine.js"></script>
    <script src="analysis-engine.js"></script>
    <script src="capabilities-engine.js"></script>
    <script src="spreadsheet.js"></script>
    <script src="workspace.js"></script>
    <script src="review.js"></script>
    <script src="review-ui.js"></script>
    <script src="value-review.js"></script>
    <script src="analytics.js"></script>
    <script src="capabilities.js"></script>
    <script src="review-workbench.js"></script>
    <script src="app.js"></script>
  </body>
</html>
